name: "CWE-316: DIS Canton Password Heap Persistence Proof"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  prove-cwe316:
    name: "Prove CWE-316 — Password Persists in JVM Heap"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (matches DIS target)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify environment
        run: |
          java -version
          keytool 2>&1 | head -1 || true
          echo "DIS v2.9.3.0 bundles OpenJDK21U-jre_x64_windows_hotspot_21.0.9_10"

      - name: Compile PoC
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "  Compiling DIS CWE-316 PoC against JDK 21"
          echo "  Source references:"
          echo "    Tools.java:86-99 (signing block, password never zeroed)"
          echo "    KeystoreRepository.java:47-49 (password read, never zeroed)"
          echo "═══════════════════════════════════════════════════════════════"
          cd src
          javac DISPasswordLeakPoC.java
          echo "Compilation successful"

      - name: "Run PoC — Prove password persists in heap"
        id: poc_run
        run: |
          cd src
          set +e
          java -Xmx256m DISPasswordLeakPoC 2>&1 | tee ../poc-output.txt
          POC_EXIT=${PIPESTATUS[0]}
          set -e

          if [ $POC_EXIT -eq 1 ]; then
            echo "poc_result=VULNERABLE" >> $GITHUB_OUTPUT
            echo ""
            echo "CONFIRMED: Password persists in JVM heap after signing"
          elif [ $POC_EXIT -eq 0 ]; then
            echo "poc_result=NOT_VULNERABLE" >> $GITHUB_OUTPUT
          else
            echo "poc_result=ERROR" >> $GITHUB_OUTPUT
            echo "PoC exited with unexpected code: $POC_EXIT"
          fi

      - name: Upload PoC output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-output
          path: poc-output.txt

      - name: "Verdict"
        if: always()
        run: |
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          RESULT="${{ steps.poc_run.outputs.poc_result }}"
          if [ "$RESULT" = "VULNERABLE" ]; then
            echo "  STATUS: VULNERABILITY CONFIRMED"
            echo ""
            echo "  The canton PKCS#12 keystore password was found in a JVM"
            echo "  heap dump taken after Tools.saveXML() completed."
            echo ""
            echo "  Affected files:"
            echo "    Tools.java:89      — char[] never zeroed"
            echo "    Tools.java:91-92   — passed to KeyStore APIs"
            echo "    Tools.java:93-99   — function returns, no cleanup"
            echo "    KeystoreRepository.java:47-49 — byte[] not zeroed"
            echo ""
            echo "  Fix: Arrays.fill(keystorePassword, '\\0') in finally block"
          elif [ "$RESULT" = "NOT_VULNERABLE" ]; then
            echo "  STATUS: Not vulnerable (unexpected)"
          else
            echo "  STATUS: Error during PoC execution"
          fi
          echo "═══════════════════════════════════════════════════════════════"
